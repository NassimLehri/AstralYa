# Histoire
intro.title = ASTRALYA STUDIOS
intro.subtitle = Les Gardiens d'Astralya
intro.p1 = Dans un temps immémorial, Astralya était un havre de paix,
intro.p2 = protégé par l''éclat des Sept Cristaux Stellaires.
intro.p3 = Mais des profondeurs du Néant surgit Morvax,
intro.p4 = un ancien Gardien corrompu par une soif de pouvoir infinie.
intro.p5 = Il brisa l''équilibre, dispersant les Cristaux
intro.p6 = et plongeant le monde dans une pénombre grandissante.
intro.p7 = Trois jeunes héros ont été choisis par le destin :
intro.p8 = Nassim, le vaillant protecteur,
intro.p9 = Yasmine, la lumière guérisseuse,
intro.p10 = et Lwiz, le maître des constellations.
intro.p11 = Leur quête commence ici, dans le petit village d''Étoilebourg.
intro.p12 = Le futur d''Astralya repose entre leurs mains...
