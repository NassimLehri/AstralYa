# History
intro.title = ASTRALYA STUDIOS
intro.subtitle = Guardians of AstralYa
intro.p1 = In immemorial times, AstralYa was a haven of peace,
intro.p2 = protected by the brilliance of the Seven Stellar Crystals.
intro.p3 = But from the depths of the Void emerged Morvax,
intro.p4 = an ancient Guardian corrupted by an infinite thirst for power.
intro.p5 = He broke the balance, scattering the Crystals
intro.p6 = and plunging the world into a growing gloom.
intro.p7 = Three young heroes were chosen by destiny:
intro.p8 = Nassim, the valiant protector,
intro.p9 = Yasmine, the healing light,
intro.p10 = and Lwiz, the master of constellations.
intro.p11 = Their quest begins here, in the small village of Starburg.
intro.p12 = The future of AstralYa rests in their hands...
